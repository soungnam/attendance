<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }

  .header { background: #111; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header a { color: #aaa; font-size: 13px; text-decoration: none; }
  .header a:hover { color: #fff; }

  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; }
  .tab { flex: 1; padding: 14px 8px; font-size: 14px; font-weight: 500; border: none; background: none; cursor: pointer; color: #888; border-bottom: 3px solid transparent; }
  .tab.active { color: #111; border-bottom-color: #111; }

  .sec { display: none; padding: 20px 16px; max-width: 600px; margin: 0 auto; }
  .sec.active { display: block; }

  .card { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; padding: 20px; margin-bottom: 16px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px 10px; text-align: center; }
  .stat-v { font-size: 26px; font-weight: 700; }
  .stat-l { font-size: 12px; color: #888; margin-top: 4px; }

  .rec-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
  .rec-row:last-child { border-bottom: none; }
  .rec-avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .rec-info { margin-left: 10px; flex: 1; }
  .rec-name { font-size: 14px; font-weight: 600; }
  .rec-date { font-size: 12px; color: #888; margin-top: 2px; }

  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-in { background: #e6f4ea; color: #137333; }
  .badge-out { background: #fce8e6; color: #c5221f; }

  .empty { text-align: center; color: #ccc; font-size: 14px; padding: 2.5rem 0; }

  .btn-clear { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #888; }
  .btn-clear:hover { background: #fce8e6; border-color: #c5221f; color: #c5221f; }

  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0; }
  #qrcode { background: #fff; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; }
  .qr-url { font-size: 13px; color: #555; background: #f5f5f5; padding: 10px 14px; border-radius: 8px; word-break: break-all; text-align: center; width: 100%; }

  .btn-dl { background: #111; color: #fff; border: none; border-radius: 10px; padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  .btn-dl:hover { background: #333; }
  .btn-print { background: #f0f0f0; color: #333; border: none; border-radius: 10px; padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  .btn-print:hover { background: #e0e0e0; }

  .setup-note { font-size: 13px; color: #666; background: #f8f8f8; border-radius: 8px; padding: 14px 16px; line-height: 1.7; margin-bottom: 16px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter-row input { flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .filter-row input:focus { border-color: #111; }
</style>
</head>
<body>

<div class="header">
  <h1>관리자 페이지</h1>
  <a href="index.html">← 직원 출퇴근 화면</a>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('records')">출퇴근 내역</button>
  <button class="tab" onclick="showTab('qr')">QR 발급</button>
</div>

<div id="records" class="sec active">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-v" id="sTotal">0</div><div class="stat-l">전체 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sToday">0</div><div class="stat-l">오늘 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sNames">0</div><div class="stat-l">인원 수</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:600">출퇴근 내역</div>
      <button class="btn-clear" onclick="clearAll()">전체 초기화</button>
    </div>
    <div class="filter-row">
      <input type="text" id="filterInput" placeholder="이름으로 검색..." oninput="renderRecords()"/>
    </div>
    <div id="allRecs"><div class="empty">기록이 없습니다</div></div>
  </div>
</div>

<div id="qr" class="sec">
  <div class="setup-note">
    아래 QR코드를 <strong>인쇄해서 출입구에 부착</strong>하세요.<br>
    직원이 스마트폰으로 스캔하면 출퇴근 기록 화면이 열립니다.
  </div>
  <div class="card">
    <div class="qr-wrap">
      <div id="qrcode"></div>
      <div class="qr-url" id="qrUrl"></div>
      <button class="btn-dl" onclick="downloadQR()">QR 이미지 저장</button>
      <button class="btn-print" onclick="printQR()">인쇄하기</button>
    </div>
  </div>
</div>

<script>
  let records = [];
  try { records = JSON.parse(localStorage.getItem('att_v4') || '[]'); } catch(e) {}

  function save() { try { localStorage.setItem('att_v4', JSON.stringify(records)); } catch(e) {} }
  function today() { return new Date().toLocaleDateString('ko-KR'); }
  function initials(n) { return n.trim().slice(0, 2); }

  function showTab(id) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['records','qr'][i] === id));
    document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'records') renderRecords();
  }

  function renderRecords() {
    const t = today();
    const keyword = document.getElementById('filterInput').value.trim();
    document.getElementById('sTotal').textContent = records.length;
    document.getElementById('sToday').textContent = records.filter(r => r.date === t).length;
    document.getElementById('sNames').textContent = new Set(records.map(r => r.name)).size;

    let recs = records.slice().reverse();
    if (keyword) recs = recs.filter(r => r.name.includes(keyword));

    const el = document.getElementById('allRecs');
    if (!recs.length) { el.innerHTML = '<div class="empty">기록이 없습니다</div>'; return; }
    el.innerHTML = recs.map(r => `
      <div class="rec-row">
        <div class="rec-avatar">${initials(r.name)}</div>
        <div class="rec-info">
          <div class="rec-name">${r.name}</div>
          <div class="rec-date">${r.date} ${r.time}</div>
        </div>
        <span class="badge ${r.type==='출근'?'badge-in':'badge-out'}">${r.type}</span>
      </div>`).join('');
  }

  function clearAll() {
    if (!confirm('모든 기록을 초기화하시겠습니까?')) return;
    records = []; save(); renderRecords();
  }

  function downloadQR() {
    const canvas = document.querySelector('#qrcode canvas');
    if (!canvas) return;
    const a = document.createElement('a');
    a.download = '출퇴근_QR.png';
    a.href = canvas.toDataURL();
    a.click();
  }

  function printQR() {
    const canvas = document.querySelector('#qrcode canvas');
    if (!canvas) return;
    const w = window.open('');
    w.document.write(`
      <div style="text-align:center;font-family:sans-serif;padding:40px">
        <img src="${canvas.toDataURL()}" style="width:250px"><br><br>
        <b style="font-size:22px">출퇴근 QR</b><br>
        <span style="font-size:15px;color:#666">스캔 후 이름을 입력하세요</span>
      </div>`);
    w.print();
  }

  (function makeQR() {
    const url = location.href.replace('admin.html', 'index.html').replace(/\/$/, '') + (location.href.includes('admin.html') ? '' : '/index.html');
    const indexUrl = location.origin + location.pathname.replace('admin.html', 'index.html');
    document.getElementById('qrUrl').textContent = indexUrl;
    new QRCode(document.getElementById('qrcode'), {
      text: indexUrl, width: 220, height: 220, colorDark: '#000', colorLight: '#fff'
    });
  })();

  renderRecords();
</script>
</body>
</html>
