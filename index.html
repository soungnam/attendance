<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

  .wrap { width: 100%; max-width: 400px; }

  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-size: 22px; font-weight: 600; color: #111; }
  .logo p { font-size: 14px; color: #888; margin-top: 4px; }

  .card { background: #fff; border-radius: 16px; border: 1px solid #e8e8e8; padding: 28px 24px; }

  label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500; }
  input[type=text] { width: 100%; padding: 13px 16px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s; }
  input[type=text]:focus { border-color: #111; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
  .btn-in { background: #111; color: #fff; }
  .btn-out { background: #f0f0f0; color: #333; }
  .btn:hover { opacity: 0.85; }

  .result { display: none; text-align: center; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin: 0 auto 16px; }
  .result-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .result-time { font-size: 14px; color: #888; margin-bottom: 16px; }

  .badge { display: inline-block; padding: 6px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .badge-in { background: #e6f4ea; color: #137333; }
  .badge-out { background: #fce8e6; color: #c5221f; }

  .history { text-align: left; margin-top: 16px; border-top: 1px solid #f0f0f0; padding-top: 14px; }
  .history-title { font-size: 12px; color: #aaa; margin-bottom: 8px; }
  .hist-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #f8f8f8; }
  .hist-row:last-child { border: none; }

  .btn-next { width: 100%; padding: 13px; border-radius: 10px; font-size: 15px; background: #f5f5f5; border: none; cursor: pointer; color: #555; margin-top: 18px; font-weight: 500; }
  .btn-next:hover { background: #eee; }

  .admin-link { text-align: center; margin-top: 20px; font-size: 13px; color: #bbb; }
  .admin-link a { color: #bbb; text-decoration: none; }
  .admin-link a:hover { color: #888; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <h1>출퇴근 기록</h1>
    <p>이름을 입력하고 출근 또는 퇴근을 선택하세요</p>
  </div>

  <div class="card">
    <div id="formView">
      <label>이름</label>
      <input type="text" id="nameIn" placeholder="예: 홍길동" autofocus
        onkeydown="if(event.key==='Enter') doIn()"/>
      <div class="btn-row">
        <button class="btn btn-in" onclick="doIn()">출근</button>
        <button class="btn btn-out" onclick="doOut()">퇴근</button>
      </div>
    </div>

    <div id="resultView" class="result">
      <div class="avatar" id="resAvatar"></div>
      <div class="result-name" id="resName"></div>
      <div id="resBadge"></div>
      <div class="result-time" id="resTime"></div>
      <div id="resHistory" class="history"></div>
      <button class="btn-next" onclick="resetForm()">다음 사람 기록하기</button>
    </div>
  </div>

  <div class="admin-link">
    <a href="admin.html">관리자 페이지 →</a>
  </div>
</div>

<script>
  let records = [];
  try { records = JSON.parse(localStorage.getItem('att_v4') || '[]'); } catch(e) {}

  function save() { try { localStorage.setItem('att_v4', JSON.stringify(records)); } catch(e) {} }
  function today() { return new Date().toLocaleDateString('ko-KR'); }
  function nowTime() { return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); }
  function nowFull() { return new Date().toLocaleString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}); }
  function initials(n) { return n.trim().slice(0, 2); }

  function doIn() { record('출근'); }
  function doOut() { record('퇴근'); }

  function record(type) {
    const name = document.getElementById('nameIn').value.trim();
    if (!name) { alert('이름을 입력하세요'); return; }
    const rec = { name, type, date: today(), time: nowTime(), full: nowFull(), ts: Date.now() };
    records.push(rec);
    save();
    showResult(name, type, rec);
  }

  function showResult(name, type, rec) {
    document.getElementById('formView').style.display = 'none';
    const rv = document.getElementById('resultView');
    rv.style.display = 'block';
    document.getElementById('resAvatar').textContent = initials(name);
    document.getElementById('resName').textContent = name + ' 님';
    document.getElementById('resBadge').innerHTML = type === '출근'
      ? '<span class="badge badge-in">✓ 출근 완료</span>'
      : '<span class="badge badge-out">✓ 퇴근 완료</span>';
    document.getElementById('resTime').textContent = rec.full;

    const todayRecs = records.filter(r => r.name === name && r.date === today()).slice(-6).reverse();
    const histEl = document.getElementById('resHistory');
    if (todayRecs.length > 1) {
      histEl.innerHTML = '<div class="history-title">오늘 기록</div>'
        + todayRecs.map(r => `
          <div class="hist-row">
            <span class="badge ${r.type==='출근'?'badge-in':'badge-out'}" style="font-size:12px;padding:3px 10px">${r.type}</span>
            <span style="color:#666">${r.time}</span>
          </div>`).join('');
    } else {
      histEl.innerHTML = '';
    }
  }

  function resetForm() {
    document.getElementById('formView').style.display = 'block';
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('nameIn').value = '';
    document.getElementById('nameIn').focus();
  }
</script>
</body>
</html>
