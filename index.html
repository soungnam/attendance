<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 관리</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }

  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 14px 8px; font-size: 14px; font-weight: 500; border: none; background: none; cursor: pointer; color: #888; border-bottom: 3px solid transparent; }
  .tab.active { color: #111; border-bottom-color: #111; }

  .sec { display: none; padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .sec.active { display: block; }

  .card { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; padding: 20px; margin-bottom: 16px; }

  label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: #111; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #111; }
  .btn-in { background: #111; color: #fff; border-color: #111; }
  .btn-in:hover { background: #333; }
  .btn:hover { background: #f5f5f5; }

  .result-card { background: #fff; border-radius: 16px; border: 1px solid #e8e8e8; padding: 28px 20px; text-align: center; margin-bottom: 16px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; margin: 0 auto 14px; }
  .result-name { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .result-time { font-size: 14px; color: #666; margin-bottom: 16px; }

  .badge { display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .badge-in { background: #e6f4ea; color: #137333; }
  .badge-out { background: #fce8e6; color: #c5221f; }

  .history-title { font-size: 13px; color: #888; text-align: left; margin: 16px 0 8px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
  .hist-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
  .hist-row:last-child { border-bottom: none; }

  .btn-reset { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; background: #f5f5f5; border: none; cursor: pointer; color: #555; margin-top: 4px; }
  .btn-reset:hover { background: #eee; }

  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
  #qrcode { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fff; }
  .qr-hint { font-size: 13px; color: #888; text-align: center; line-height: 1.6; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-v { font-size: 24px; font-weight: 600; }
  .stat-l { font-size: 12px; color: #888; margin-top: 2px; }

  .rec-list { }
  .rec-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f5f5f5; }
  .rec-row:last-child { border-bottom: none; }
  .rec-avatar { width: 34px; height: 34px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .rec-info { margin-left: 10px; flex: 1; }
  .rec-name { font-size: 14px; font-weight: 500; }
  .rec-date { font-size: 12px; color: #888; }
  .empty { text-align: center; color: #bbb; font-size: 14px; padding: 2rem 0; }

  .btn-clear { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #888; }
  .btn-clear:hover { background: #fce8e6; border-color: #c5221f; color: #c5221f; }

  .setup-note { font-size: 13px; color: #888; line-height: 1.6; padding: 14px 16px; background: #f8f8f8; border-radius: 8px; margin-bottom: 16px; }
  .setup-note strong { color: #444; }

  .btn-dl { background: #111; color: #fff; border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 4px; }
  .btn-dl:hover { background: #333; }
</style>
</head>
<body>

<!-- 비밀번호 모달 -->
<div id="pwModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:28px 24px;width:90%;max-width:340px;text-align:center;">
    <div style="font-size:18px;font-weight:600;margin-bottom:6px;">관리자 전용</div>
    <div style="font-size:14px;color:#888;margin-bottom:20px;">비밀번호를 입력하세요</div>
    <input type="password" id="pwInput" placeholder="비밀번호" style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none;margin-bottom:10px;text-align:center;"
      onkeydown="if(event.key==='Enter') checkPw()"/>
    <div id="pwError" style="display:none;color:#c5221f;font-size:13px;margin-bottom:10px;">비밀번호가 틀렸습니다</div>
    <div style="display:flex;gap:8px;">
      <button onclick="closePwModal()" style="flex:1;padding:12px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:15px;cursor:pointer;">취소</button>
      <button onclick="checkPw()" style="flex:1;padding:12px;border-radius:8px;border:none;background:#111;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">확인</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('checkin')">출퇴근</button>
  <button class="tab" onclick="showTab('admin')">관리자</button>
  <button class="tab" onclick="showTab('qrgen')">QR 발급</button>
</div>

<!-- 출퇴근 탭 (직원이 QR 스캔 후 보는 화면) -->
<div id="checkin" class="sec active">

  <div id="formView" class="card">
    <label>이름을 입력하세요</label>
    <input type="text" id="nameIn" placeholder="예: 홍길동" autofocus
      onkeydown="if(event.key==='Enter') doIn()"/>
    <div class="btn-row">
      <button class="btn btn-in" onclick="doIn()">출근</button>
      <button class="btn" onclick="doOut()">퇴근</button>
    </div>
  </div>

  <div id="resultView" style="display:none">
    <div class="result-card">
      <div class="avatar" id="resAvatar"></div>
      <div class="result-name" id="resName"></div>
      <div id="resBadge"></div>
      <div class="result-time" id="resTime"></div>
      <div id="resHistory"></div>
    </div>
    <button class="btn-reset" onclick="resetForm()">다음 사람 기록하기</button>
  </div>
</div>

<!-- 관리자 탭 -->
<div id="admin" class="sec">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-v" id="sTotal">0</div><div class="stat-l">전체 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sToday">0</div><div class="stat-l">오늘 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sNames">0</div><div class="stat-l">인원 수</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:500">출퇴근 내역</div>
      <button class="btn-clear" onclick="clearAll()">초기화</button>
    </div>
    <div id="allRecs" class="rec-list"><div class="empty">기록이 없습니다</div></div>
  </div>
</div>

<!-- QR 발급 탭 -->
<div id="qrgen" class="sec">
  <div class="setup-note">
    <strong>사용 방법</strong><br>
    아래 QR코드를 인쇄해서 출입구에 부착하세요.<br>
    직원이 스마트폰으로 스캔하면 이 페이지가 열리고, 이름을 입력해 출퇴근을 기록할 수 있습니다.
  </div>
  <div class="card">
    <div class="qr-wrap">
      <div id="qrcode"></div>
      <div class="qr-hint" id="qrHint">이 파일을 웹 서버에 올리거나<br>로컬에서 열면 QR이 생성됩니다</div>
      <button class="btn-dl" onclick="downloadQR()">QR 이미지 저장</button>
    </div>
  </div>
</div>

<script>
let records = [];
try { records = JSON.parse(localStorage.getItem('att_main') || '[]'); } catch(e) {}

function save() { try { localStorage.setItem('att_main', JSON.stringify(records)); } catch(e) {} }
function today() { return new Date().toLocaleDateString('ko-KR'); }
function nowTime() { return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); }
function nowFull() { return new Date().toLocaleString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}); }
function initials(n) { return n.trim().slice(0, 2); }

const ADMIN_PW = 'scsh0701**';
let adminUnlocked = false;

function showTab(id) {
  if ((id === 'admin' || id === 'qrgen') && !adminUnlocked) {
    document.getElementById('pwModal').style.display = 'flex';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwModal').dataset.target = id;
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
    return;
  }
  switchTab(id);
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['checkin','admin','qrgen'][i] === id));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'admin') renderAdmin();
}

function checkPw() {
  if (document.getElementById('pwInput').value === ADMIN_PW) {
    adminUnlocked = true;
    document.getElementById('pwModal').style.display = 'none';
    switchTab(document.getElementById('pwModal').dataset.target);
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closePwModal() {
  document.getElementById('pwModal').style.display = 'none';
}

function doIn() { record('출근'); }
function doOut() { record('퇴근'); }

function record(type) {
  const name = document.getElementById('nameIn').value.trim();
  if (!name) { alert('이름을 입력하세요'); return; }
  const rec = { name, type, date: today(), time: nowTime(), full: nowFull(), ts: Date.now() };
  records.push(rec);
  save();
  showResult(name, type, rec);
}

function showResult(name, type, rec) {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultView').style.display = 'block';
  document.getElementById('resAvatar').textContent = initials(name);
  document.getElementById('resName').textContent = name + ' 님';
  document.getElementById('resBadge').innerHTML = type === '출근'
    ? '<span class="badge badge-in">✓ 출근 완료</span>'
    : '<span class="badge badge-out">✓ 퇴근 완료</span>';
  document.getElementById('resTime').textContent = rec.full;

  const todayRecs = records.filter(r => r.name === name && r.date === today()).slice(-6).reverse();
  const histEl = document.getElementById('resHistory');
  if (todayRecs.length > 1) {
    histEl.innerHTML = '<div class="history-title">오늘 기록</div>'
      + todayRecs.map(r => `
        <div class="hist-row">
          <span class="badge ${r.type==='출근'?'badge-in':'badge-out'}" style="font-size:12px;padding:3px 10px">${r.type}</span>
          <span style="color:#555;font-size:13px">${r.time}</span>
        </div>`).join('');
  } else {
    histEl.innerHTML = '';
  }
}

function resetForm() {
  document.getElementById('formView').style.display = 'block';
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('nameIn').value = '';
  document.getElementById('nameIn').focus();
}

function renderAdmin() {
  const t = today();
  document.getElementById('sTotal').textContent = records.length;
  document.getElementById('sToday').textContent = records.filter(r => r.date === t).length;
  document.getElementById('sNames').textContent = new Set(records.map(r => r.name)).size;
  const el = document.getElementById('allRecs');
  const recs = records.slice().reverse();
  if (!recs.length) { el.innerHTML = '<div class="empty">기록이 없습니다</div>'; return; }
  el.innerHTML = recs.map(r => `
    <div class="rec-row">
      <div class="rec-avatar">${initials(r.name)}</div>
      <div class="rec-info">
        <div class="rec-name">${r.name}</div>
        <div class="rec-date">${r.date} ${r.time}</div>
      </div>
      <span class="badge ${r.type==='출근'?'badge-in':'badge-out'}" style="font-size:12px">${r.type}</span>
    </div>`).join('');
}

function clearAll() {
  if (!confirm('모든 기록을 초기화하시겠습니까?')) return;
  records = []; save(); renderAdmin();
}

function downloadQR() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) { alert('QR 코드가 없습니다.'); return; }
  const a = document.createElement('a');
  a.download = '출퇴근_QR.png';
  a.href = canvas.toDataURL();
  a.click();
}

(function makeQR() {
  const url = location.href;
  const el = document.getElementById('qrcode');
  new QRCode(el, { text: url, width: 220, height: 220, colorDark: '#000', colorLight: '#fff' });
  document.getElementById('qrHint').textContent = 'QR코드를 인쇄해서 출입구에 부착하세요';
})();
</script>
</body>
</html>
