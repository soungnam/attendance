<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 관리</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 14px 8px; font-size: 14px; font-weight: 500; border: none; background: none; cursor: pointer; color: #888; border-bottom: 3px solid transparent; }
  .tab.active { color: #111; border-bottom-color: #111; }
  .sec { display: none; padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .sec.active { display: block; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: #111; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #111; }
  .btn-in { background: #111; color: #fff; border-color: #111; }
  .btn:hover:not(:disabled) { background: #f5f5f5; }
  .btn-in:hover:not(:disabled) { background: #333; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .result-card { background: #fff; border-radius: 16px; border: 1px solid #e8e8e8; padding: 28px 20px; text-align: center; margin-bottom: 16px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; margin: 0 auto 14px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .result-name { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .result-time { font-size: 14px; color: #666; margin-bottom: 8px; }
  .result-loc { font-size: 12px; color: #aaa; margin-bottom: 16px; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .badge-in { background: #e6f4ea; color: #137333; }
  .badge-out { background: #fce8e6; color: #c5221f; }
  .btn-reset { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; background: #f5f5f5; border: none; cursor: pointer; color: #555; margin-top: 4px; }
  .btn-reset:hover { background: #eee; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
  #qrcode { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fff; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-v { font-size: 24px; font-weight: 600; }
  .stat-l { font-size: 12px; color: #888; margin-top: 2px; }
  .rec-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid #f5f5f5; gap: 10px; }
  .rec-row:last-child { border-bottom: none; }
  .rec-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .rec-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .rec-info { flex: 1; }
  .rec-name { font-size: 14px; font-weight: 600; }
  .rec-date { font-size: 12px; color: #888; margin-top: 2px; }
  .rec-loc { font-size: 11px; color: #bbb; margin-top: 1px; }
  .empty { text-align: center; color: #bbb; font-size: 14px; padding: 2rem 0; }
  .btn-clear { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: #888; }
  .btn-clear:hover { background: #e8f0fe; border-color: #1a56db; color: #1a56db; }
  .setup-note { font-size: 13px; color: #888; line-height: 1.6; padding: 14px 16px; background: #f8f8f8; border-radius: 8px; margin-bottom: 16px; }
  .setup-note strong { color: #444; }
  .btn-dl { background: #111; color: #fff; border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 4px; }
  .btn-dl:hover { background: #333; }
  .loading { text-align: center; color: #aaa; font-size: 14px; padding: 1.5rem 0; }
  .cam-area { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-bottom: 10px; display: none; }
  .cam-area video { width: 100%; display: block; max-height: 260px; object-fit: cover; }
  .photo-preview { width: 100%; border-radius: 10px; margin-bottom: 10px; display: none; }
  .cam-btn { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #f8f8f8; color: #333; margin-bottom: 8px; }
  .cam-btn:hover { background: #eee; }
  .loc-info { font-size: 12px; color: #888; padding: 6px 10px; background: #f8f8f8; border-radius: 6px; margin-bottom: 8px; display: none; }
  .photo-required { font-size: 12px; color: #c5221f; padding: 6px 10px; background: #fce8e6; border-radius: 6px; margin-top: 8px; text-align: center; }
  .sending-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  .sending-overlay .msg { color: #fff; font-size: 16px; font-weight: 500; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sendingOverlay" class="sending-overlay">
  <div class="spinner"></div>
  <div class="msg">저장 중입니다...</div>
</div>

<div id="pwModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:28px 24px;width:90%;max-width:340px;text-align:center;">
    <div style="font-size:18px;font-weight:600;margin-bottom:6px;">관리자 전용</div>
    <div style="font-size:14px;color:#888;margin-bottom:20px;">비밀번호를 입력하세요</div>
    <input type="password" id="pwInput" placeholder="비밀번호" style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none;margin-bottom:10px;text-align:center;" onkeydown="if(event.key==='Enter') checkPw()"/>
    <div id="pwError" style="display:none;color:#c5221f;font-size:13px;margin-bottom:10px;">비밀번호가 틀렸습니다</div>
    <div style="display:flex;gap:8px;">
      <button onclick="closePwModal()" style="flex:1;padding:12px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:15px;cursor:pointer;">취소</button>
      <button onclick="checkPw()" style="flex:1;padding:12px;border-radius:8px;border:none;background:#111;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">확인</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('checkin')">출퇴근</button>
  <button class="tab" onclick="showTab('admin')">관리자</button>
  <button class="tab" onclick="showTab('qrgen')">QR 발급</button>
</div>

<div id="checkin" class="sec active">
  <div id="formView" class="card">
    <label>이름을 입력하세요</label>
    <input type="text" id="nameIn" placeholder="예: 홍길동" autofocus/>
    <div style="margin-top:14px">
      <label>사진 촬영 <span style="color:#c5221f">*필수</span></label>
      <div class="cam-area" id="camArea">
        <video id="camVideo" autoplay playsinline muted></video>
      </div>
      <img id="photoPreview" class="photo-preview" alt="촬영된 사진"/>
      <canvas id="camCanvas" style="display:none"></canvas>
      <button class="cam-btn" id="camBtn" onclick="toggleCamera()">📷 카메라 켜기</button>
      <button class="cam-btn" id="shootBtn" onclick="takePhoto()" style="display:none">📸 사진 찍기</button>
      <button class="cam-btn" id="retakeBtn" onclick="retakePhoto()" style="display:none">🔄 다시 찍기</button>
    </div>
    <div class="loc-info" id="locInfo">📍 위치 확인 중...</div>
    <div class="btn-row">
      <button class="btn btn-in" id="btnIn" onclick="doRecord('출근')" disabled>출근</button>
      <button class="btn" id="btnOut" onclick="doRecord('퇴근')" disabled>퇴근</button>
    </div>
    <div class="photo-required" id="photoMsg">📸 사진을 먼저 찍어야 출퇴근 기록이 가능합니다</div>
  </div>
  <div id="resultView" style="display:none">
    <div class="result-card">
      <div class="avatar" id="resAvatar"></div>
      <div class="result-name" id="resName"></div>
      <div id="resBadge"></div>
      <div class="result-time" id="resTime"></div>
      <div class="result-loc" id="resLoc"></div>
    </div>
    <button class="btn-reset" onclick="resetForm()">다음 사람 기록하기</button>
  </div>
</div>

<div id="admin" class="sec">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-v" id="sTotal">-</div><div class="stat-l">전체 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sToday">-</div><div class="stat-l">오늘 기록</div></div>
    <div class="stat-box"><div class="stat-v" id="sNames">-</div><div class="stat-l">인원 수</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:500">출퇴근 내역</div>
      <button class="btn-clear" onclick="renderAdmin()">새로고침</button>
    </div>
    <div id="allRecs"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<div id="qrgen" class="sec">
  <div class="setup-note">
    <strong>사용 방법</strong><br>
    아래 QR코드를 인쇄해서 출입구에 부착하세요.<br>
    직원이 스마트폰으로 스캔하면 이 페이지가 열립니다.
  </div>
  <div class="card">
    <div class="qr-wrap">
      <div id="qrcode"></div>
      <div style="font-size:13px;color:#888;text-align:center">QR코드를 인쇄해서 출입구에 부착하세요</div>
      <button class="btn-dl" onclick="downloadQR()">QR 이미지 저장</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwsumMbV2Zxckw1DCb-1D5fC5IvAkwQldsBl1w057GMd97YlppNAd0AQZbibYibw2bd/exec';
const ADMIN_PW = 'scsh0701**';
let adminUnlocked = false;
let photoBase64 = '';
let locationStr = '';
let camStream = null;
let camOn = false;

function lockBtns() {
  document.getElementById('btnIn').disabled = true;
  document.getElementById('btnOut').disabled = true;
  document.getElementById('photoMsg').style.display = 'block';
}
function unlockBtns() {
  document.getElementById('btnIn').disabled = false;
  document.getElementById('btnOut').disabled = false;
  document.getElementById('photoMsg').style.display = 'none';
}

function today() { return new Date().toLocaleDateString('ko-KR'); }
function nowTime() { return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); }
function nowFull() { return new Date().toLocaleString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}); }
function initials(n) { return n.trim().slice(0, 2); }

function getLocation() {
  if (!navigator.geolocation) return;
  document.getElementById('locInfo').style.display = 'block';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude.toFixed(5);
    const lng = pos.coords.longitude.toFixed(5);
    locationStr = lat + ',' + lng;
    document.getElementById('locInfo').textContent = '📍 위치 확인됨 (' + lat + ', ' + lng + ')';
  }, () => {
    document.getElementById('locInfo').textContent = '📍 위치 가져오기 실패';
    locationStr = '';
  });
}

async function toggleCamera() {
  if (camOn) { stopCamera(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    document.getElementById('camVideo').srcObject = camStream;
    document.getElementById('camArea').style.display = 'block';
    document.getElementById('camBtn').textContent = '❌ 카메라 끄기';
    document.getElementById('shootBtn').style.display = 'block';
    camOn = true;
  } catch(e) {
    alert('카메라 권한이 필요합니다. 브라우저 설정에서 카메라를 허용해주세요.');
    lockBtns();
  }
}

function stopCamera() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; camOn = false;
  document.getElementById('camArea').style.display = 'none';
  document.getElementById('camBtn').textContent = '📷 카메라 켜기';
  document.getElementById('shootBtn').style.display = 'none';
}

function takePhoto() {
  const video = document.getElementById('camVideo');
  const canvas = document.getElementById('camCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  photoBase64 = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
  const preview = document.getElementById('photoPreview');
  preview.src = canvas.toDataURL('image/jpeg', 0.6);
  preview.style.display = 'block';
  stopCamera();
  document.getElementById('camBtn').style.display = 'none';
  document.getElementById('shootBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'block';
  unlockBtns();
}

function retakePhoto() {
  photoBase64 = '';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'none';
  document.getElementById('camBtn').style.display = 'block';
  document.getElementById('camBtn').textContent = '📷 카메라 켜기';
  lockBtns();
}

function showTab(id) {
  if ((id === 'admin' || id === 'qrgen') && !adminUnlocked) {
    document.getElementById('pwModal').style.display = 'flex';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwModal').dataset.target = id;
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
    return;
  }
  switchTab(id);
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['checkin','admin','qrgen'][i] === id));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'admin') renderAdmin();
}

function checkPw() {
  if (document.getElementById('pwInput').value === ADMIN_PW) {
    adminUnlocked = true;
    document.getElementById('pwModal').style.display = 'none';
    switchTab(document.getElementById('pwModal').dataset.target);
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closePwModal() { document.getElementById('pwModal').style.display = 'none'; }

function doRecord(type) {
  const name = document.getElementById('nameIn').value.trim();
  if (!name) { alert('이름을 입력하세요'); return; }
  if (!photoBase64) { alert('사진을 먼저 찍어주세요'); lockBtns(); return; }
  document.getElementById('btnIn').disabled = true;
  document.getElementById('btnOut').disabled = true;
  document.getElementById('sendingOverlay').style.display = 'flex';
  const rec = { name, type, date: today(), time: nowTime(), full: nowFull(), location: locationStr, photo: photoBase64 };
  fetch(GAS_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(rec)
  }).then(() => {
    document.getElementById('sendingOverlay').style.display = 'none';
    showResult(name, type, rec);
  }).catch(() => {
    document.getElementById('sendingOverlay').style.display = 'none';
    alert('저장 실패. 인터넷 연결을 확인하세요.');
    unlockBtns();
  });
}

function showResult(name, type, rec) {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultView').style.display = 'block';
  const avatarEl = document.getElementById('resAvatar');
  avatarEl.innerHTML = photoBase64
    ? '<img src="data:image/jpeg;base64,' + photoBase64 + '" alt="사진"/>'
    : initials(name);
  document.getElementById('resName').textContent = name + ' 님';
  document.getElementById('resBadge').innerHTML = type === '출근'
    ? '<span class="badge badge-in">✓ 출근 완료</span>'
    : '<span class="badge badge-out">✓ 퇴근 완료</span>';
  document.getElementById('resTime').textContent = rec.full;
  document.getElementById('resLoc').textContent = locationStr ? '📍 ' + locationStr : '';
}

function resetForm() {
  document.getElementById('formView').style.display = 'block';
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('nameIn').value = '';
  photoBase64 = '';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'none';
  document.getElementById('camBtn').style.display = 'block';
  document.getElementById('camBtn').textContent = '📷 카메라 켜기';
  lockBtns();
  document.getElementById('nameIn').focus();
  getLocation();
}

function renderAdmin() {
  document.getElementById('allRecs').innerHTML = '<div class="loading">불러오는 중...</div>';
  fetch(GAS_URL + '?action=get')
    .then(r => r.json())
    .then(data => {
      const t = today();
      document.getElementById('sTotal').textContent = data.length;
      document.getElementById('sToday').textContent = data.filter(r => r[2] === t).length;
      document.getElementById('sNames').textContent = new Set(data.map(r => r[0])).size;
      if (!data.length) { document.getElementById('allRecs').innerHTML = '<div class="empty">기록이 없습니다</div>'; return; }
      document.getElementById('allRecs').innerHTML = data.slice().reverse().map(r => `
        <div class="rec-row">
          <div class="rec-avatar">${r[5] ? '<img src="' + r[5] + '" alt="사진"/>' : initials(r[0])}</div>
          <div class="rec-info">
            <div class="rec-name">${r[0]}</div>
            <div class="rec-date">${r[2]} ${r[3]}</div>
            ${r[4] ? '<div class="rec-loc">📍 <a href="https://maps.google.com/?q=' + r[4] + '" target="_blank" style="color:#1a56db;font-size:11px">지도 보기</a></div>' : ''}
          </div>
          <span class="badge ${r[1]==='출근'?'badge-in':'badge-out'}" style="font-size:12px">${r[1]}</span>
        </div>`).join('');
    })
    .catch(() => {
      document.getElementById('allRecs').innerHTML = '<div class="empty">불러오기 실패. 새로고침을 눌러주세요.</div>';
    });
}

function downloadQR() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) return;
  const a = document.createElement('a');
  a.download = '출퇴근_QR.png';
  a.href = canvas.toDataURL();
  a.click();
}

(function init() {
  lockBtns();
  const url = location.href.split('?')[0].split('#')[0];
  new QRCode(document.getElementById('qrcode'), { text: url, width: 220, height: 220, colorDark: '#000', colorLight: '#fff' });
  getLocation();
})();
</script>
</body>
</html>
